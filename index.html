<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KHALID CAMERA</title>
<style>
body {
background:#000;
color:#00ff41;
text-align:center;
font-family:Arial;
padding:20px;
}
button {
background:#00ff41;
color:#000;
padding:14px;
border:0;
border-radius:8px;
margin:10px;
}
video,img {
width:100%;
max-width:350px;
border:2px solid #00ff41;
}
</style>
</head>
<body>
<h2>KHALID CAMERA</h2>
<p>افتح الكاميرا الأمامية بعد السماح.</p>
<button onclick="startCamera()">فتح الكاميرا</button>
<br>
<video id="video" autoplay playsinline></video>
<br>
<button onclick="takePhoto()">التقاط صورة</button>
<canvas id="canvas" hidden></canvas>
<img id="photo" hidden>
<p>يمكنك حفظ صورتك أو مشاركتها بنفسك.</p>
<script>
let stream;
async function startCamera(){
try{
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"}
});
document.getElementById("video").srcObject=stream;
}catch(e){
alert("لم يتم السماح بالكاميرا");
}
}
function takePhoto(){
if(!stream)return;
const v=document.getElementById("video");
const c=document.getElementById("canvas");
c.width=v.videoWidth;
c.height=v.videoHeight;
c.getContext("2d").drawImage(v,0,0);
const img=document.getElementById("photo");
img.src=c.toDataURL("image/png");
img.hidden=false;
}
</script>
</body>
</html>
